<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-label="HackMatch / System architecture"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#5d7043" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#f7f8f2"/><style>text{font-family:Arial,sans-serif;fill:#20291a}.title{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#69785c}.entity{font-size:16px;font-weight:700}.field{font-family:monospace;font-size:13px}.note{font-size:12px;fill:#627151}.label{font-size:11px;fill:#516c31}</style><text x="45" y="52" class="title">HackMatch / System architecture</text><text x="45" y="79" class="sub">Production target: Vercel Next.js + hosted MySQL + MongoDB Atlas. Local development needs no Docker.</text><path d="M345 305H525" fill="none" stroke="#6f8657" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="360" y="278" width="101.5" height="17" fill="#f7f8f2"/><text x="365" y="290" class="label">HTTPS / cookies</text><path d="M875 280H950V220H1040" fill="none" stroke="#6f8657" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="920" y="193" width="64.9" height="17" fill="#f7f8f2"/><text x="925" y="205" class="label">SQL / TLS</text><path d="M875 330H970V500H1040" fill="none" stroke="#6f8657" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="910" y="468" width="89.3" height="17" fill="#f7f8f2"/><text x="915" y="480" class="label">MongoDB / TLS</text><rect x="45" y="220" width="300" height="154" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M52 220H338Q345 220 345 227V260H45V227Q45 220 52 220" fill="#e5f1c5"/><text x="61" y="246" class="entity">BROWSER</text><text x="61" y="285" class="field">Public landing page</text><text x="61" y="310" class="field">Sign-in / sign-up</text><text x="61" y="335" class="field">Participant workspace</text><text x="61" y="360" class="field">Administrator dashboard</text><rect x="525" y="220" width="350" height="179" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M532 220H868Q875 220 875 227V260H525V227Q525 220 532 220" fill="#e5f1c5"/><text x="541" y="246" class="entity">NEXT.JS / VERCEL</text><text x="541" y="285" class="field">Separate API route files</text><text x="541" y="310" class="field">Input + permission checks</text><text x="541" y="335" class="field">Salted password hashing</text><text x="541" y="360" class="field">Visible parameterized SQL</text><text x="541" y="385" class="field">SQL transactions + aggregation</text><rect x="1040" y="135" width="315" height="179" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M1047 135H1348Q1355 135 1355 142V175H1040V142Q1040 135 1047 135" fill="#e5f1c5"/><text x="1056" y="161" class="entity">MYSQL</text><text x="1056" y="200" class="field">Accounts + sessions</text><text x="1056" y="225" class="field">Tracks + teams</text><text x="1056" y="250" class="field">Memberships + applications</text><text x="1056" y="275" class="field">Constraints / triggers</text><text x="1056" y="300" class="field">Views / stored procedure</text><rect x="1040" y="450" width="315" height="154" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M1047 450H1348Q1355 450 1355 457V490H1040V457Q1040 450 1047 450" fill="#e5f1c5"/><text x="1056" y="476" class="entity">MONGODB ATLAS</text><text x="1056" y="515" class="field">Participant profiles</text><text x="1056" y="540" class="field">Recruitment briefs</text><text x="1056" y="565" class="field">JSON Schema validation</text><text x="1056" y="590" class="field">Indexes + skill aggregation</text><text x="45" y="680" class="note">Environment variables hold database configuration. Secrets stay on the server. Database credentials never enter the browser bundle.</text><text x="45" y="705" class="note">MySQL is authoritative for membership and capacity. There are no distributed transactions or cross-database foreign keys.</text></svg>