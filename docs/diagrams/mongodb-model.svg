<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="HackMatch / MongoDB document model"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#5d7043" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#f7f8f2"/><style>text{font-family:Arial,sans-serif;fill:#20291a}.title{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#69785c}.entity{font-size:16px;font-weight:700}.field{font-family:monospace;font-size:13px}.note{font-size:12px;fill:#627151}.label{font-size:11px;fill:#516c31}</style><text x="45" y="52" class="title">HackMatch / MongoDB document model</text><text x="45" y="79" class="sub">Related flexible information is embedded in each document. SQL identifiers are stored as decimal strings.</text><rect x="45" y="140" width="590" height="279" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M52 140H628Q635 140 635 147V180H45V147Q45 140 52 140" fill="#e5f1c5"/><text x="61" y="166" class="entity">PARTICIPANT_PROFILES</text><text x="61" y="205" class="field">user_id: string (unique SQL reference)</text><text x="61" y="230" class="field">bio: string; preferred_role: string</text><text x="61" y="255" class="field">availability: enum; discoverable: boolean</text><text x="61" y="280" class="field">skills: string[] (normalized, max 15)</text><text x="61" y="305" class="field">interests: string[] (max 8)</text><text x="61" y="330" class="field">projects: [{title, description, url}] (max 5)</text><text x="61" y="355" class="field">updated_at: date</text><text x="61" y="380" class="field">INDEX: user_id UNIQUE</text><text x="61" y="405" class="field">INDEX: discoverable + skills (multikey)</text><rect x="740" y="140" width="610" height="229" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M747 140H1343Q1350 140 1350 147V180H740V147Q740 140 747 140" fill="#e5f1c5"/><text x="756" y="166" class="entity">TEAM_OPENINGS</text><text x="756" y="205" class="field">team_id: string (unique SQL reference)</text><text x="756" y="230" class="field">title: string; description: string</text><text x="756" y="255" class="field">required_skills: string[] (1..15)</text><text x="756" y="280" class="field">preferred_availability: enum</text><text x="756" y="305" class="field">updated_at: date</text><text x="756" y="330" class="field">INDEX: team_id UNIQUE</text><text x="756" y="355" class="field">One editable recruitment brief per team</text><text x="45" y="530" class="entity">Retrieval pipeline</text><text x="45" y="565" class="field">SQL eligibility → $match → $setIntersection → $size → $sort → $limit → attach SQL names</text><text x="45" y="610" class="note">Both collections enforce JSON Schema validators. Cross-database parent references are checked by the application.</text><text x="45" y="640" class="note">A candidate’s team membership is read from MySQL; discoverable is only their personal discovery preference.</text></svg>