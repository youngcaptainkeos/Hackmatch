<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-label="HackMatch / Relational schema"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#5d7043" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#f7f8f2"/><style>text{font-family:Arial,sans-serif;fill:#20291a}.title{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#69785c}.entity{font-size:16px;font-weight:700}.field{font-family:monospace;font-size:13px}.note{font-size:12px;fill:#627151}.label{font-size:11px;fill:#516c31}</style><text x="45" y="52" class="title">HackMatch / Relational schema</text><text x="45" y="79" class="sub">MySQL • PK = primary key • FK = foreign key • UK = unique key • IDs are INT UNSIGNED</text><path d="M355 205H475V205H555" fill="none" stroke="#6f8657" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="400" y="178" width="58.8" height="17" fill="#f7f8f2"/><text x="405" y="190" class="label">1 → many</text><path d="M355 300H465V560H555" fill="none" stroke="#6f8657" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="400" y="453" width="58.8" height="17" fill="#f7f8f2"/><text x="405" y="465" class="label">1 → 0..1</text><path d="M1165 270V365H1060V440" fill="none" stroke="#6f8657" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1100" y="343" width="58.8" height="17" fill="#f7f8f2"/><text x="1105" y="355" class="label">1 → many</text><path d="M1000 550H900V570H855" fill="none" stroke="#6f8657" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="910" y="523" width="58.8" height="17" fill="#f7f8f2"/><text x="915" y="535" class="label">1 → many</text><path d="M355 350H425V825H1110V800" fill="none" stroke="#6f8657" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="445" y="798" width="58.8" height="17" fill="#f7f8f2"/><text x="450" y="810" class="label">1 → many</text><path d="M1165 650V680" fill="none" stroke="#6f8657" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1175" y="658" width="58.8" height="17" fill="#f7f8f2"/><text x="1180" y="670" class="label">1 → many</text><rect x="45" y="130" width="310" height="254" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M52 130H348Q355 130 355 137V170H45V137Q45 130 52 130" fill="#e5f1c5"/><text x="61" y="156" class="entity">USERS</text><text x="61" y="195" class="field">PK id</text><text x="61" y="220" class="field">name VARCHAR(80)</text><text x="61" y="245" class="field">UK email VARCHAR(254)</text><text x="61" y="270" class="field">password_hash VARCHAR(200)</text><text x="61" y="295" class="field">role ENUM</text><text x="61" y="320" class="field">failed_logins INT</text><text x="61" y="345" class="field">locked_until DATETIME NULL</text><text x="61" y="370" class="field">created_at TIMESTAMP</text><rect x="555" y="130" width="300" height="129" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M562 130H848Q855 130 855 137V170H555V137Q555 130 562 130" fill="#e5f1c5"/><text x="571" y="156" class="entity">SESSIONS</text><text x="571" y="195" class="field">PK token_hash CHAR(64)</text><text x="571" y="220" class="field">FK user_id → users</text><text x="571" y="245" class="field">expires_at DATETIME</text><rect x="1000" y="130" width="380" height="179" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M1007 130H1373Q1380 130 1380 137V170H1000V137Q1000 130 1007 130" fill="#e5f1c5"/><text x="1016" y="156" class="entity">TRACKS</text><text x="1016" y="195" class="field">PK id</text><text x="1016" y="220" class="field">UK name VARCHAR(80)</text><text x="1016" y="245" class="field">description VARCHAR(2000)</text><text x="1016" y="270" class="field">max_members INT (2..8)</text><text x="1016" y="295" class="field">registration_open BOOLEAN</text><rect x="555" y="480" width="300" height="179" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M562 480H848Q855 480 855 487V520H555V487Q555 480 562 480" fill="#e5f1c5"/><text x="571" y="506" class="entity">MEMBERSHIPS</text><text x="571" y="545" class="field">PK/FK user_id → users</text><text x="571" y="570" class="field">FK team_id → teams</text><text x="571" y="595" class="field">is_captain BOOLEAN</text><text x="571" y="620" class="field">joined_at TIMESTAMP</text><text x="571" y="645" class="field">UK captain_team_id (generated)</text><rect x="1000" y="440" width="380" height="204" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M1007 440H1373Q1380 440 1380 447V480H1000V447Q1000 440 1007 440" fill="#e5f1c5"/><text x="1016" y="466" class="entity">TEAMS</text><text x="1016" y="505" class="field">PK id</text><text x="1016" y="530" class="field">FK track_id → tracks</text><text x="1016" y="555" class="field">UK name VARCHAR(80)</text><text x="1016" y="580" class="field">idea VARCHAR(2000)</text><text x="1016" y="605" class="field">member_count INT (trigger)</text><text x="1016" y="630" class="field">created_at TIMESTAMP</text><rect x="1000" y="680" width="380" height="179" rx="7" fill="#fff" stroke="#bdcbb0"/><path d="M1007 680H1373Q1380 680 1380 687V720H1000V687Q1000 680 1007 680" fill="#e5f1c5"/><text x="1016" y="706" class="entity">APPLICATIONS</text><text x="1016" y="745" class="field">PK id; FK user_id, team_id</text><text x="1016" y="770" class="field">message VARCHAR(1000)</text><text x="1016" y="795" class="field">kind: application / invitation</text><text x="1016" y="820" class="field">status ENUM; created_at</text><text x="1016" y="845" class="field">UK (user_id, team_id)</text><text x="45" y="860" class="note">One current team per participant. At most one captain per team. Team/application actions use transactions.</text></svg>